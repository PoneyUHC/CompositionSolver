[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "composition-model"
version = "0.1.0"
description = "Reachability across a composition graph of recorded traces, with CP-SAT"
requires-python = ">=3.10"
dependencies = ["ortools==9.15.6755"]

[tool.setuptools.packages.find]
where = ["src"]
